platform: "postgres"
name: "inputdb.public.forward_rates"
env: "DEV"
description: "Forward reference rates."
schema:
- name: "curve"
  type: "string"
  native_type: "varchar(128)"
  nullable: false
  primary_key: true
- name: "rate_date"
  type: "date"
  native_type: "date"
  nullable: false
  primary_key: true
- name: "rate"
  type: "number"
  native_type: "numeric"
  nullable: false
  primary_key: false

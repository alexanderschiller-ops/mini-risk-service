name: TDL Lineage Agent

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'tools/tdl_comment_agent.py'
      - 'src/main/resources/contracts/**'
      - 'tdl-output/**'
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'tools/tdl_comment_agent.py'
      - 'src/main/resources/contracts/**'
      - 'tdl-output/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Java architecture and integration tests
        run: mvn -B test

      - name: Generate lineage from Java comments
        run: |
          python3 tools/tdl_comment_agent.py \
            --source src/main/java \
            --output tdl-output \
            --contracts src/main/resources/contracts

      - name: Verify generated YAML is committed
        run: |
          git diff --exit-code -- tdl-output src/main/resources/contracts

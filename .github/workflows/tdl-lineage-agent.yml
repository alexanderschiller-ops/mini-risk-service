name: TDL Lineage Agent

on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - '.github/workflows/tdl-lineage-agent.yml'
      - 'src/main/resources/contracts/**'
      - 'tdl-output/**'
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/main/java/**'
      - 'src/test/java/**'
      - '.github/workflows/tdl-lineage-agent.yml'
      - 'src/main/resources/contracts/**'
      - 'tdl-output/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Java architecture and integration tests
        run: mvn -B test
